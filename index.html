<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Moved | Upstream Gold (PNG) Limited</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #071524, #0d1b2a);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #ffffff;
    }

    .notice-card {
      width: 100%;
      max-width: 620px;
      background: #ffffff;
      color: #071524;
      border-radius: 22px;
      padding: 38px 32px;
      text-align: center;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
    }

    .notice-card h1 {
      font-size: 30px;
      margin-bottom: 14px;
      font-weight: 800;
    }

    .notice-card p {
      font-size: 16px;
      line-height: 1.7;
      color: #4b5563;
      margin-bottom: 24px;
    }

    .new-link-box {
      background: #f4f7fb;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 24px;
      color: #071524;
      font-weight: 700;
      word-break: break-word;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 0 24px;
      background: #d4a24c;
      color: #071524;
      border-radius: 12px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: 0.2s ease;
    }

    .btn:hover {
      background: #b88324;
      color: #ffffff;
    }

    .footer-note {
      margin-top: 22px;
      font-size: 13px;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <div class="notice-card">
    <h1>Website Address Changed</h1>

    <p>
      The official website for <strong>Upstream Gold (PNG) Limited</strong>
      has moved to a new address.
    </p>

    <div class="new-link-box">
      https://upstream.infinityfree.me/index.html
    </div>

    <a class="btn" href="https://upstream.infinityfree.me/index.html">
      Open Website
    </a>

    <div class="footer-note">
      Please use the new website address going forward.
    </div>
  </div>
</body>
</html>
