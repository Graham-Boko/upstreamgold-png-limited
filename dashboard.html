<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Partner Dashboard | Secure Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold-100: #F5E7C6;
            --gold-200: #E9CB8B;
            --gold-primary: #D4AF37;
            --gold-deep: #B8901C;
            --gold-dark: #8C6B1F;
            --bg-deep: #0B0F13;
            --bg-card: rgba(18, 25, 32, 0.8);
            --bg-card-hover: rgba(25, 34, 42, 0.9);
            --surface: #11181E;
            --border-gold: rgba(212, 175, 55, 0.2);
            --text-primary: #EFF3F6;
            --text-secondary: #9AAEBF;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --shadow-elevated: 0 25px 50px -12px rgba(0,0,0,0.6);
            --shadow-card: 0 4px 20px rgba(0,0,0,0.3);
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            --radius-lg: 1.5rem;
            --radius-md: 1rem;
            --radius-sm: 0.6rem;
        }

        body.light {
            --bg-deep: #F8F6F2;
            --bg-card: rgba(255, 255, 255, 0.9);
            --bg-card-hover: rgba(255,255,255,1);
            --surface: #FFFFFF;
            --border-gold: rgba(180, 140, 60, 0.25);
            --text-primary: #1A2332;
            --text-secondary: #5A6E7F;
            --shadow-card: 0 12px 30px rgba(0,0,0,0.05);
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            background-image: radial-gradient(ellipse at 20% 20%, rgba(212,175,55,0.03) 0%, transparent 50%);
            overflow-x: hidden;
        }

        .app {
            display: flex;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }

        /* ---------- SIDEBAR (mobile‑ready) ---------- */
        .sidebar {
            width: 280px;
            background: rgba(14, 22, 30, 0.7);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--border-gold);
            position: fixed;
            height: 100vh;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            box-shadow: 8px 0 30px rgba(0,0,0,0.3);
            transform: translateX(-100%);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        body.light .sidebar {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            box-shadow: 8px 0 30px rgba(0,0,0,0.05);
        }

        @media (min-width: 1025px) {
            .sidebar {
                transform: translateX(0);
            }
        }

        .sidebar-brand {
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-gold);
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-deep));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0B0F13;
            font-size: 1.3rem;
        }

        .brand-text {
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--text-primary);
        }

        .brand-text span {
            color: var(--gold-primary);
        }

        .nav-menu {
            list-style: none;
            padding: 1.5rem 1rem;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            margin: 4px 0;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .nav-item i {
            width: 24px;
            font-size: 1.1rem;
        }

        .nav-item.active {
            background: rgba(212, 175, 55, 0.12);
            color: var(--gold-primary);
        }

        .nav-item:hover:not(.active) {
            background: rgba(212, 175, 55, 0.06);
            color: var(--gold-200);
        }

        .wrike-side-link {
            margin-top: auto;
            border-top: 1px solid var(--border-gold);
            padding: 1.2rem;
        }

        .wrike-btn-side {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid var(--gold-primary);
            border-radius: 40px;
            padding: 8px 14px;
            text-decoration: none;
            color: var(--gold-primary);
            font-weight: 600;
            font-size: 0.85rem;
            justify-content: center;
            transition: 0.2s;
        }

        /* ---------- MAIN CONTENT ---------- */
        .main {
            flex: 1;
            width: 100%;
            overflow-x: hidden;
        }

        .topbar {
            background: rgba(14, 22, 30, 0.6);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-gold);
            padding: 10px 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 90;
            flex-wrap: wrap;
            gap: 10px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mobile-toggle {
            background: transparent;
            border: none;
            font-size: 1.4rem;
            color: var(--gold-primary);
            cursor: pointer;
            display: block;
        }

        @media (min-width: 1025px) {
            .mobile-toggle {
                display: none;
            }
        }

        .breadcrumb {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--gold-primary);
        }

        .search-wrapper {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-gold);
            border-radius: 40px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-wrapper input {
            border: none;
            background: transparent;
            outline: none;
            width: 140px;
            color: var(--text-primary);
            font-size: 0.85rem;
        }

        @media (max-width: 680px) {
            .search-wrapper {
                display: none;
            }
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 6px;
            border-radius: 50%;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-deep));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0B0F13;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            border: 2px solid var(--gold-200);
        }

        .logout-dropdown {
            position: absolute;
            top: 42px;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            padding: 6px 0;
            width: 130px;
            display: none;
            z-index: 200;
            box-shadow: var(--shadow-elevated);
        }

        .logout-dropdown button {
            background: transparent;
            border: none;
            padding: 8px 14px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            color: var(--text-primary);
            font-weight: 500;
        }

        .logout-dropdown button:hover {
            background: rgba(212,175,55,0.15);
            color: var(--gold-primary);
        }

        .page-container {
            padding: 1.2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* ---------- CARDS (compact on mobile) ---------- */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-gold);
            border-radius: 1.2rem;
            padding: 1.2rem;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-card);
            margin-bottom: 1.2rem;
        }

        .card h3, .card h4 {
            font-family: var(--font-heading);
            margin-bottom: 0.8rem;
            font-size: 1.2rem;
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            font-size: 0.9rem;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-primary);
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .org-node {
            padding: 10px 12px;
            border-left: 3px solid var(--gold-primary);
            margin: 10px 0;
            background: rgba(212, 175, 55, 0.04);
            border-radius: 0 10px 10px 0;
            font-weight: 500;
            font-size: 0.9rem;
            word-break: break-word;
        }

        .doc-card {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.12);
            flex-wrap: wrap;
            gap: 12px;
        }

        .doc-info h4 {
            font-size: 1rem;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .doc-info p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            max-width: 100%;
        }

        .download-btn {
            background: transparent;
            border: 1.5px solid var(--gold-primary);
            padding: 6px 16px;
            border-radius: 40px;
            color: var(--gold-primary);
            font-weight: 600;
            font-size: 0.75rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .two-col-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        /* --- Mobile overrides for all sections --- */
        @media (max-width: 768px) {
            .page-container {
                padding: 0.8rem;
            }
            .card {
                padding: 1rem;
                border-radius: 1rem;
            }
            .card h3 {
                font-size: 1.1rem;
            }
            .two-col-grid {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }
            .org-node {
                padding: 8px 10px;
                font-size: 0.85rem;
            }
            .list-item {
                font-size: 0.85rem;
                padding: 8px 0;
            }
            .doc-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .download-btn {
                align-self: flex-end;
            }
            .topbar {
                padding: 8px 1rem;
            }
            .breadcrumb {
                font-size: 1rem;
            }
            .user-avatar {
                width: 34px;
                height: 34px;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 0.9rem;
            }
            .org-node {
                font-size: 0.8rem;
            }
            .badge {
                font-size: 0.65rem;
            }
            .btn-login, .download-btn {
                font-size: 0.7rem;
            }
            .list-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .calendar-event {
                flex-wrap: wrap;
            }
        }

        /* utility */
        button, .nav-item {
            cursor: pointer;
        }
        i, .fas, .fab {
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="fas fa-gem"></i></div>
            <div class="brand-text">Partner<span>Hub</span></div>
        </div>
        <ul class="nav-menu" id="navMenu">
            <li class="nav-item active" data-page="documents">
                <i class="fas fa-folder-open"></i><span>Documents</span>
            </li>
            <li class="nav-item" data-page="organisation">
                <i class="fas fa-sitemap"></i><span>Organisation</span>
            </li>
            <li class="nav-item" data-page="calendar">
                <i class="fas fa-calendar-alt"></i><span>Calendar</span>
            </li>
        </ul>
        <div class="wrike-side-link">
            <a href="#" class="wrike-btn-side" id="wrikeMockBtn">
                <i class="fab fa-wrike"></i> <span>Wrike Workspace</span> <i class="fas fa-external-link-alt"></i>
            </a>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <div class="topbar-left">
                <button class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></button>
                <div class="breadcrumb" id="breadcrumb">Documents</div>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <div class="search-wrapper">
                    <i class="fas fa-search" style="color: var(--gold-primary);"></i>
                    <input type="text" id="globalSearch" placeholder="Search...">
                </div>
                <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
                <div class="user-avatar" id="userAvatar">
                    <span id="userInitial">JD</span>
                    <div class="logout-dropdown" id="logoutDropdown">
                        <button id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sign out</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="page-container" id="pageContainer"></div>
    </div>
</div>

<script>
    // Auth guard
    if (!sessionStorage.getItem('isAuthenticated')) {
        window.location.href = 'login.html';
    }
    const userEmail = sessionStorage.getItem('userEmail') || 'partner@example.com';
    document.getElementById('userInitial').innerText = userEmail.charAt(0).toUpperCase();

    // Logout dropdown
    const userAvatar = document.getElementById('userAvatar');
    const logoutDropdown = document.getElementById('logoutDropdown');
    userAvatar.addEventListener('click', (e) => {
        e.stopPropagation();
        logoutDropdown.style.display = logoutDropdown.style.display === 'block' ? 'none' : 'block';
    });
    document.addEventListener('click', () => { logoutDropdown.style.display = 'none'; });
    document.getElementById('logoutBtn').addEventListener('click', () => {
        sessionStorage.removeItem('isAuthenticated');
        sessionStorage.removeItem('userEmail');
        window.location.href = 'login.html';
    });

    // Dummy data
    const complianceDocs = [
        { title: "IPA Certificate", desc: "Investment Promotion Authority registration.", icon: "fas fa-certificate" },
        { title: "TIN Certificate", desc: "Tax Identification Number documentation.", icon: "fas fa-file-invoice" },
        { title: "Code of Conduct", desc: "Ethical governance framework.", icon: "fas fa-gavel" },
        { title: "HSE Policy", desc: "Health, Safety & Environment policies.", icon: "fas fa-hard-hat" },
        { title: "Community Commitment", desc: "Community engagement strategy.", icon: "fas fa-hand-holding-heart" }
    ];

    function renderDocuments() {
        return `<div class="card">
            <h3><i class="fas fa-gavel" style="color: var(--gold-primary);"></i> Corporate Documents</h3>
            ${complianceDocs.map(doc => `
                <div class="doc-card">
                    <div class="doc-info">
                        <h4><i class="${doc.icon}" style="color: var(--gold-primary);"></i> ${doc.title}</h4>
                        <p>${doc.desc}</p>
                    </div>
                    <a href="#" class="download-btn" data-doc="${doc.title}"><i class="fas fa-download"></i> PDF</a>
                </div>
            `).join('')}
        </div>`;
    }

    const pageContent = {
        documents: renderDocuments,
        organisation: () => `
            <div class="card">
                <h3><i class="fas fa-user-tie"></i> Board of Directors</h3>
                <div class="org-node"><strong>Michael Konopa</strong> – Chairman</div>
                <div class="org-node"><strong>Ruth Wanga</strong> – Non-Executive Director</div>
                <div class="org-node"><strong>David Toua</strong> – Independent Director</div>
            </div>
            <div class="two-col-grid">
                <div class="card">
                    <h3><i class="fas fa-chart-line"></i> Executive Leadership</h3>
                    <div class="org-node"><strong>David Nema</strong> – Managing Director</div>
                    <div class="org-node"><strong>Sarah L. Kila</strong> – COO</div>
                    <div class="org-node"><strong>James P. Yama</strong> – Exploration Director</div>
                    <div class="org-node"><strong>Grace T. Wama</strong> – Community & Sustainability</div>
                </div>
                <div class="card">
                    <h3><i class="fas fa-hard-hat"></i> Departments</h3>
                    <div class="list-item"><span>Geology & Resource</span><span class="badge">12</span></div>
                    <div class="list-item"><span>Mine Planning</span><span class="badge">8</span></div>
                    <div class="list-item"><span>HSE</span><span class="badge">7</span></div>
                    <div class="list-item"><span>Community Relations</span><span class="badge">9</span></div>
                </div>
            </div>
            <div class="card">
                <h3><i class="fas fa-globe"></i> Regional Offices</h3>
                <div class="list-item"><span>Port Moresby – HQ</span><span>+675 308 7654</span></div>
                <div class="list-item"><span>Lae – Logistics Hub</span><span>Operations</span></div>
                <div class="list-item"><span>Tabubil – Exploration</span><span>Field office</span></div>
            </div>
        `,
        calendar: () => `
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 1rem;">
                    <h3>📅 June 2026</h3>
                    <button id="addEventBtn" style="background: rgba(212,175,55,0.1); border: 1px solid var(--gold-primary); padding: 5px 14px; border-radius: 30px; color: var(--gold-primary); font-size: 0.8rem;"><i class="fas fa-plus"></i> New Event</button>
                </div>
                <div class="list-item"><span><strong>Jun 10</strong> – Board Meeting</span><span class="badge">9:00 AM</span></div>
                <div class="list-item"><span><strong>Jun 18</strong> – ESG Committee</span><span class="badge">2:00 PM</span></div>
                <div class="list-item"><span><strong>Jun 25</strong> – Exploration Review</span><span class="badge">10:30 AM</span></div>
                <div class="list-item"><span><strong>Jun 30</strong> – Q2 Reporting Deadline</span><span class="badge">All day</span></div>
            </div>
            <div class="two-col-grid">
                <div class="card"><h4>📌 Upcoming deadlines</h4><div class="list-item"><span>Mine plan submission</span><span>Jun 28</span></div><div class="list-item"><span>Community report</span><span>Jul 02</span></div></div>
                <div class="card"><h4>🎉 Holidays</h4><div class="list-item"><span>Independence Day (PNG)</span><span>Sep 16</span></div><div class="list-item"><span>Christmas break</span><span>Dec 25 – Jan 02</span></div></div>
            </div>
        `
    };

    const navItems = document.querySelectorAll('.nav-item');
    const pageContainer = document.getElementById('pageContainer');
    const breadcrumb = document.getElementById('breadcrumb');
    const sidebar = document.getElementById('sidebar');
    const mobileToggle = document.getElementById('mobileToggle');

    function renderPage(page) {
        const content = pageContent[page] || pageContent.documents;
        pageContainer.innerHTML = content();
        if (page === 'calendar') {
            const addBtn = document.getElementById('addEventBtn');
            if (addBtn) addBtn.addEventListener('click', () => alert('Add event feature coming soon.'));
        }
        document.querySelectorAll('.download-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                alert(`Download ${btn.dataset.doc || 'document'}.pdf – replace with actual link.`);
            });
        });
    }

    function setActivePage(pageId) {
        navItems.forEach(item => item.classList.toggle('active', item.dataset.page === pageId));
        let title = pageId === 'documents' ? 'Documents' : (pageId === 'organisation' ? 'Organisation Structure' : 'Calendar');
        breadcrumb.innerText = title;
        renderPage(pageId);
    }

    navItems.forEach(item => {
        item.addEventListener('click', () => {
            setActivePage(item.dataset.page);
            if (window.innerWidth <= 1024) sidebar.classList.remove('open');
        });
    });

    mobileToggle.addEventListener('click', () => sidebar.classList.toggle('open'));

    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('light');
        const isLight = document.body.classList.contains('light');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        themeToggle.innerHTML = isLight ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });
    if (localStorage.getItem('theme') === 'light') {
        document.body.classList.add('light');
        themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
    }

    // Search mock
    document.getElementById('globalSearch').addEventListener('input', (e) => {
        if (e.target.value.length > 2) console.log(`Search: ${e.target.value}`);
    });

    // Wrike mock link
    document.getElementById('wrikeMockBtn').addEventListener('click', (e) => {
        e.preventDefault();
        alert('Wrike integration – add your workspace URL.');
    });

    setActivePage('documents');
</script>
</body>
</html>
