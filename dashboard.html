<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Partner Dashboard | Partner Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Same styling – consistent with homepage */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold-primary: #D4AF37;
            --gold-deep: #B8901C;
            --gold-soft: #F9E5B3;
            --charcoal: #11181C;
            --slate: #1E2A32;
            --stone: #F5F2EF;
            --pure-white: #FFFFFF;
            --off-white: #FCFAF7;
            --text-dark: #1F2A3E;
            --text-muted: #5A6E7F;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-card-hover: rgba(255, 255, 255, 1);
            --border-gold: rgba(212, 175, 55, 0.25);
            --shadow-sm: 0 12px 30px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 35px 50px -20px rgba(0, 0, 0, 0.2);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            --radius-card: 1.8rem;
            --radius-btn: 3rem;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(145deg, var(--stone) 0%, var(--pure-white) 100%);
            color: var(--text-dark);
            line-height: 1.5;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        body.dark {
            background: var(--charcoal);
            color: var(--pure-white);
            --bg-card: rgba(30, 42, 50, 0.85);
            --bg-card-hover: rgba(30, 42, 50, 0.95);
            --text-dark: #EFF3F6;
            --text-muted: #9AAEBF;
            --border-gold: rgba(212, 175, 55, 0.2);
        }

        .app {
            display: flex;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }

        /* Sidebar (glass) */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-gold);
            position: fixed;
            height: 100vh;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            box-shadow: 8px 0 25px rgba(0, 0, 0, 0.05);
            transform: translateX(-100%);
        }

        body.dark .sidebar {
            background: rgba(20, 28, 34, 0.92);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        @media (min-width: 1025px) {
            .sidebar {
                transform: translateX(0);
            }
            .main {
                margin-left: 280px;
            }
        }

        .sidebar-brand {
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-gold);
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-deep));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--charcoal);
            font-size: 1.3rem;
        }

        .brand-text {
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--text-dark);
        }

        .brand-text span {
            color: var(--gold-primary);
        }

        .nav-menu {
            list-style: none;
            padding: 1.5rem 1rem;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            margin: 6px 0;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .nav-item i {
            width: 24px;
            font-size: 1.1rem;
        }

        .nav-item.active {
            background: rgba(212, 175, 55, 0.12);
            color: var(--gold-primary);
        }

        .nav-item:hover:not(.active) {
            background: rgba(212, 175, 55, 0.06);
            color: var(--gold-deep);
        }

        .wrike-side-link {
            margin-top: auto;
            border-top: 1px solid var(--border-gold);
            padding: 1.2rem;
        }

        .wrike-btn-side {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid var(--gold-primary);
            border-radius: 40px;
            padding: 8px 14px;
            text-decoration: none;
            color: var(--gold-primary);
            font-weight: 600;
            font-size: 0.85rem;
            justify-content: center;
            transition: 0.2s;
        }

        .wrike-btn-side:hover {
            background: var(--gold-primary);
            color: var(--charcoal);
        }

        /* Main content */
        .main {
            flex: 1;
            width: 100%;
            overflow-x: hidden;
        }

        .topbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-gold);
            padding: 10px 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 90;
            flex-wrap: wrap;
            gap: 10px;
        }

        body.dark .topbar {
            background: rgba(20, 28, 34, 0.85);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mobile-toggle {
            background: transparent;
            border: none;
            font-size: 1.4rem;
            color: var(--gold-primary);
            cursor: pointer;
            display: block;
        }

        @media (min-width: 1025px) {
            .mobile-toggle {
                display: none;
            }
        }

        .breadcrumb {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--gold-primary);
        }

        .search-wrapper {
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-gold);
            border-radius: 40px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-wrapper input {
            border: none;
            background: transparent;
            outline: none;
            width: 140px;
            color: var(--text-dark);
            font-size: 0.85rem;
        }

        @media (max-width: 680px) {
            .search-wrapper {
                display: none;
            }
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--text-muted);
            padding: 6px;
            border-radius: 50%;
            transition: 0.2s;
        }

        .icon-btn:hover {
            color: var(--gold-primary);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-deep));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--charcoal);
            font-weight: bold;
            cursor: pointer;
            position: relative;
            border: 2px solid var(--gold-soft);
        }

        .logout-dropdown {
            position: absolute;
            top: 42px;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            padding: 6px 0;
            width: 130px;
            display: none;
            z-index: 200;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(8px);
        }

        .logout-dropdown button {
            background: transparent;
            border: none;
            padding: 8px 14px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            color: var(--text-dark);
            font-weight: 500;
        }

        .logout-dropdown button:hover {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-primary);
        }

        .page-container {
            padding: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-card);
            padding: 1.5rem;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--gold-primary);
            box-shadow: var(--shadow-md);
        }

        .card h3, .card h4 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 1rem;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            font-size: 0.9rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-primary);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .org-node {
            padding: 10px 14px;
            border-left: 3px solid var(--gold-primary);
            margin: 12px 0;
            background: rgba(212, 175, 55, 0.04);
            border-radius: 0 12px 12px 0;
            font-weight: 500;
            font-size: 0.9rem;
            word-break: break-word;
        }

        .doc-card {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            flex-wrap: wrap;
            gap: 12px;
        }

        .doc-info h4 {
            font-size: 1rem;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .doc-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            max-width: 100%;
        }

        .download-btn {
            background: transparent;
            border: 1px solid var(--gold-primary);
            padding: 6px 18px;
            border-radius: var(--radius-btn);
            color: var(--gold-primary);
            font-weight: 600;
            font-size: 0.75rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .download-btn:hover {
            background: var(--gold-primary);
            color: var(--charcoal);
        }

        .two-col-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.2rem;
            margin-top: 1rem;
        }

        /* Contact Directory */
        .contact-card {
            display: flex;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            flex-wrap: wrap;
        }
        .contact-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-deep));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--charcoal);
            flex-shrink: 0;
        }
        .contact-details {
            flex: 1;
            min-width: 180px;
        }
        .contact-details h4 {
            font-size: 1rem;
            margin-bottom: 6px;
        }
        .contact-details p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .contact-details i {
            width: 20px;
            color: var(--gold-primary);
        }
        @media (max-width: 550px) {
            .contact-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .contact-avatar {
                margin-bottom: 8px;
            }
        }

        /* Mobile */
        @media (max-width: 768px) {
            .page-container {
                padding: 1rem;
            }
            .card {
                padding: 1.2rem;
                border-radius: 1.2rem;
            }
            .card h3 {
                font-size: 1.1rem;
            }
            .two-col-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .org-node {
                padding: 6px 10px;
                font-size: 0.85rem;
            }
            .list-item {
                font-size: 0.85rem;
            }
            .doc-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .download-btn {
                align-self: flex-end;
            }
            .topbar {
                padding: 8px 1rem;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 1rem;
            }
            .badge {
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="fas fa-gem"></i></div>
            <div class="brand-text">Partner<span>Portal</span></div>
        </div>
        <ul class="nav-menu" id="navMenu">
            <li class="nav-item active" data-page="documents"><i class="fas fa-folder-open"></i><span>Documents</span></li>
            <li class="nav-item" data-page="organisation"><i class="fas fa-sitemap"></i><span>Organisation</span></li>
            <li class="nav-item" data-page="calendar"><i class="fas fa-calendar-alt"></i><span>Calendar</span></li>
            <li class="nav-item" data-page="directory"><i class="fas fa-address-book"></i><span>Contact Directory</span></li>
        </ul>
        <div class="wrike-side-link">
            <a href="#" class="wrike-btn-side" id="wrikeMockBtn">
                <i class="fab fa-wrike"></i> <span>Wrike Workspace</span> <i class="fas fa-external-link-alt"></i>
            </a>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <div class="topbar-left">
                <button class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></button>
                <div class="breadcrumb" id="breadcrumb">Documents</div>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <div class="search-wrapper">
                    <i class="fas fa-search" style="color: var(--gold-primary);"></i>
                    <input type="text" id="globalSearch" placeholder="Search...">
                </div>
                <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
                <div class="user-avatar" id="userAvatar">
                    <span id="userInitial">JD</span>
                    <div class="logout-dropdown" id="logoutDropdown">
                        <button id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sign out</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="page-container" id="pageContainer"></div>
    </div>
</div>

<script>
    // Auth guard
    if (!sessionStorage.getItem('isAuthenticated')) {
        window.location.href = 'login.html';
    }
    const userEmail = sessionStorage.getItem('userEmail') || 'partner@partnerportal.com';
    document.getElementById('userInitial').innerText = userEmail.charAt(0).toUpperCase();

    // Logout dropdown
    const userAvatar = document.getElementById('userAvatar');
    const logoutDropdown = document.getElementById('logoutDropdown');
    userAvatar.addEventListener('click', (e) => {
        e.stopPropagation();
        logoutDropdown.style.display = logoutDropdown.style.display === 'block' ? 'none' : 'block';
    });
    document.addEventListener('click', () => { logoutDropdown.style.display = 'none'; });
    document.getElementById('logoutBtn').addEventListener('click', () => {
        sessionStorage.removeItem('isAuthenticated');
        sessionStorage.removeItem('userEmail');
        window.location.href = 'login.html';
    });

    // Documents data
    const complianceDocs = [
        { title: "IPA Certificate", desc: "Investment Promotion Authority registration.", icon: "fas fa-certificate" },
        { title: "TIN Certificate", desc: "Tax Identification Number documentation.", icon: "fas fa-file-invoice" },
        { title: "Code of Conduct", desc: "Ethical governance framework.", icon: "fas fa-gavel" },
        { title: "HSE Policy", desc: "Health, Safety & Environment policies.", icon: "fas fa-hard-hat" },
        { title: "Community Commitment", desc: "Community engagement strategy.", icon: "fas fa-hand-holding-heart" }
    ];

    function renderDocuments() {
        return `<div class="card">
            <h3><i class="fas fa-gavel" style="color: var(--gold-primary);"></i> Corporate Documents</h3>
            ${complianceDocs.map(doc => `
                <div class="doc-card">
                    <div class="doc-info">
                        <h4><i class="${doc.icon}" style="color: var(--gold-primary);"></i> ${doc.title}</h4>
                        <p>${doc.desc}</p>
                    </div>
                    <a href="#" class="download-btn" data-doc="${doc.title}"><i class="fas fa-download"></i> PDF</a>
                </div>
            `).join('')}
        </div>`;
    }

    // ----- CONTACT DIRECTORY: GENERIC EMAILS (NO "UPSTREAM") -----
    const positions = [
        { role: "Chief Executive Officer", dept: "Executive", email: "ceo@partnerportal.com", phone: "+675 7XXXXXXX" },
        { role: "Exploration Manager", dept: "Technical", email: "exploration@partnerportal.com", phone: "+675 7XXXXXXX" },
        { role: "Lead Consulting Geoscientist", dept: "Geology", email: "geoscience@partnerportal.com", phone: "+675 7XXXXXXX" },
        { role: "Senior Geologist", dept: "Geology", email: "geology@partnerportal.com", phone: "+675 7XXXXXXX" },
        { role: "Community Affairs Manager", dept: "Community", email: "community@partnerportal.com", phone: "+675 7XXXXXXX" },
        { role: "Chief Financial Officer", dept: "Finance", email: "finance@partnerportal.com", phone: "+675 7XXXXXXX" },
        { role: "Head of HSE & Compliance", dept: "HSE", email: "hse@partnerportal.com", phone: "+675 7XXXXXXX" }
    ];

    function renderDirectory() {
        return `<div class="card">
            <h3><i class="fas fa-address-book"></i> Key Contacts & Departments</h3>
            <p style="margin-bottom: 0.5rem; font-size: 0.85rem;"><i class="fas fa-building" style="color: var(--gold-primary);"></i> <strong>Head Office:</strong> Kwalimu Precincts, Ground Level, Somare Circuit, Waigani, NCD. P.O Box 3239, Boroko 1111, NCD, PNG</p>
            <p style="margin-bottom: 1rem; font-size: 0.85rem;"><i class="fas fa-envelope"></i> info@partnerportal.com &nbsp;|&nbsp; <i class="fas fa-phone-alt"></i> +675 7XXXXXXX</p>
            <hr style="margin: 1rem 0; border-color: var(--border-gold);">
            <p style="margin-bottom: 1rem; font-weight: 600;">Key Roles & Responsibilities</p>
            ${positions.map(pos => {
                const initial = pos.role.charAt(0);
                return `
                <div class="contact-card">
                    <div class="contact-avatar">${initial}</div>
                    <div class="contact-details">
                        <h4>${pos.role} <span class="badge">${pos.dept}</span></h4>
                        <p><i class="fas fa-envelope"></i> <a href="mailto:${pos.email}" style="color: var(--gold-primary); text-decoration: none;">${pos.email}</a></p>
                        <p><i class="fas fa-phone-alt"></i> ${pos.phone}</p>
                    </div>
                </div>
                `;
            }).join('')}
        </div>`;
    }

    const pageContent = {
        documents: renderDocuments,
        organisation: () => `
            <div class="card">
                <h3><i class="fas fa-user-tie"></i> Board of Directors</h3>
                <div class="org-node"><strong>Group Executive Chairman</strong> – Board Leadership</div>
                <div class="org-node"><strong>Non-Executive Director</strong> – Independent Oversight</div>
                <div class="org-node"><strong>Independent Director</strong> – Governance & Compliance</div>
            </div>
            <div class="two-col-grid">
                <div class="card">
                    <h3><i class="fas fa-chart-line"></i> Executive Leadership</h3>
                    <div class="org-node"><strong>Chief Executive Officer</strong></div>
                    <div class="org-node"><strong>Chief Operating Officer</strong></div>
                    <div class="org-node"><strong>Chief Financial Officer</strong></div>
                </div>
                <div class="card">
                    <h3><i class="fas fa-hard-hat"></i> Technical Departments</h3>
                    <div class="list-item"><span>Exploration & Geology</span><span class="badge">6</span></div>
                    <div class="list-item"><span>Community & Sustainability</span><span class="badge">4</span></div>
                    <div class="list-item"><span>HSE & Compliance</span><span class="badge">3</span></div>
                </div>
            </div>
            <div class="card">
                <h3><i class="fas fa-globe"></i> Regional Offices</h3>
                <div class="list-item"><span>Port Moresby – Corporate HQ</span><span>Kwalimu Precincts, Waigani</span></div>
                <div class="list-item"><span>Lae – Logistics Hub</span><span>Operations center</span></div>
                <div class="list-item"><span>Tabubil – Exploration Camp</span><span>Field office</span></div>
            </div>
        `,
        calendar: () => `
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 1rem;">
                    <h3>📅 June 2026</h3>
                    <button id="addEventBtn" style="background: rgba(212,175,55,0.1); border: 1px solid var(--gold-primary); padding: 5px 14px; border-radius: 30px; color: var(--gold-primary); font-size: 0.8rem;"><i class="fas fa-plus"></i> New Event</button>
                </div>
                <div class="list-item"><span><strong>Jun 10</strong> – Board Meeting</span><span class="badge">9:00 AM</span></div>
                <div class="list-item"><span><strong>Jun 18</strong> – ESG Committee</span><span class="badge">2:00 PM</span></div>
                <div class="list-item"><span><strong>Jun 25</strong> – Exploration Review</span><span class="badge">10:30 AM</span></div>
                <div class="list-item"><span><strong>Jun 30</strong> – Q2 Reporting Deadline</span><span class="badge">All day</span></div>
            </div>
            <div class="two-col-grid">
                <div class="card"><h4>📌 Upcoming deadlines</h4><div class="list-item"><span>Mine plan submission</span><span>Jun 28</span></div><div class="list-item"><span>Community report</span><span>Jul 02</span></div></div>
                <div class="card"><h4>🎉 Holidays</h4><div class="list-item"><span>Independence Day (PNG)</span><span>Sep 16</span></div><div class="list-item"><span>Christmas break</span><span>Dec 25 – Jan 02</span></div></div>
            </div>
        `,
        directory: renderDirectory
    };

    const navItems = document.querySelectorAll('.nav-item');
    const pageContainer = document.getElementById('pageContainer');
    const breadcrumb = document.getElementById('breadcrumb');
    const sidebar = document.getElementById('sidebar');
    const mobileToggle = document.getElementById('mobileToggle');

    function renderPage(page) {
        const content = pageContent[page] || pageContent.documents;
        pageContainer.innerHTML = content();
        if (page === 'calendar') {
            const addBtn = document.getElementById('addEventBtn');
            if (addBtn) addBtn.addEventListener('click', () => alert('Add event feature coming soon.'));
        }
        document.querySelectorAll('.download-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                alert(`Download ${btn.dataset.doc || 'document'}.pdf – replace with actual link.`);
            });
        });
    }

    function setActivePage(pageId) {
        navItems.forEach(item => item.classList.toggle('active', item.dataset.page === pageId));
        let title = pageId === 'documents' ? 'Documents' : (pageId === 'organisation' ? 'Organisation Structure' : (pageId === 'calendar' ? 'Calendar' : 'Contact Directory'));
        breadcrumb.innerText = title;
        renderPage(pageId);
    }

    navItems.forEach(item => {
        item.addEventListener('click', () => {
            setActivePage(item.dataset.page);
            if (window.innerWidth <= 1024) sidebar.classList.remove('open');
        });
    });

    mobileToggle.addEventListener('click', () => sidebar.classList.toggle('open'));

    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        localStorage.setItem('dashboardTheme', isDark ? 'dark' : 'light');
        themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });
    if (localStorage.getItem('dashboardTheme') === 'dark') {
        document.body.classList.add('dark');
        themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
    }

    document.getElementById('globalSearch').addEventListener('input', (e) => {
        if (e.target.value.length > 2) console.log(`Search: ${e.target.value}`);
    });

    document.getElementById('wrikeMockBtn').addEventListener('click', (e) => {
        e.preventDefault();
        alert('Wrike integration – add your workspace URL.');
    });

    setActivePage('documents');
</script>
</body>
</html>
