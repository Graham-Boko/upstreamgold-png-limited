<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Our Team | Leadership & Expertise</title>
  <meta name="description" content="Meet the experienced leadership, board, and technical team driving responsible mining and development in Papua New Guinea.">
  <meta name="keywords" content="mining team PNG, exploration leadership, geologists PNG, community affairs">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    :root{
      --primary:#0d1b2a;
      --secondary:#1b263b;
      --accent:#415a77;
      --soft:#778da9;
      --light:#e0e1dd;
      --panel:#f7f9fb;
      --white:#ffffff;
      --gold:#d4a24c;
      --gold-deep:#b88324;
      --text:#1b263b;
      --muted:#5d6876;
      --border:rgba(255,255,255,.14);
      --shadow:0 18px 45px rgba(13,27,42,.14);
    }

    html{scroll-behavior:smooth}

    body{
      font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;
      background:var(--light);
      color:var(--text);
      line-height:1.5;
      overflow-x:hidden;
    }

    a{text-decoration:none;color:inherit}
    img{max-width:100%;display:block}
    .container{width:min(1180px,92%);margin:auto}

    .skip-link{
      position:absolute;
      top:-40px;
      left:0;
      background:var(--gold);
      padding:8px 14px;
      z-index:100;
      color:#111;
      font-weight:800;
    }

    .skip-link:focus{top:0}

    header{
      height:86px;
      background:rgba(13,27,42,.96);
      backdrop-filter:blur(12px);
      display:flex;
      align-items:center;
      border-bottom:1px solid rgba(255,255,255,.08);
      position:sticky;
      top:0;
      z-index:50;
    }

    nav{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      width:min(1180px,92%);
      margin:auto;
      gap:24px;
      position:relative;
    }

    .brand,
    .footer-brand{
      display:none;
    }

    .menu{
      display:flex;
      gap:32px;
      align-items:center;
      justify-content:flex-start;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.7px;
      color:#f3f3f3;
      font-weight:700;
    }

    .menu a{
      position:relative;
      white-space:nowrap;
    }

    .menu a.active,
    .menu a:hover{
      color:var(--gold);
    }

    .menu a:after{
      content:"";
      position:absolute;
      left:0;
      bottom:-8px;
      width:0;
      height:2px;
      background:var(--gold);
      transition:.25s;
    }

    .menu a:hover:after,
    .menu a.active:after{
      width:100%;
    }

    .menu-toggle{
      display:none;
      background:none;
      border:0;
      color:var(--gold);
      font-size:26px;
      cursor:pointer;
      margin-left:auto;
    }

    .hero{
      min-height:560px;
      background:
        linear-gradient(90deg,rgba(13,27,42,.86) 0%,rgba(27,38,59,.55) 48%,rgba(13,27,42,.08) 100%),
        url('hero.png');
      background-size:cover;
      background-position:center;
      display:flex;
      align-items:center;
      position:relative;
    }

    .hero-content{
      max-width:760px;
      padding:76px 0;
    }

    .hero-kicker{
      font-size:13px;
      letter-spacing:3px;
      color:var(--gold);
      text-transform:uppercase;
      font-weight:800;
      margin-bottom:18px;
    }

    .hero h1{
      font-size:clamp(38px,6vw,68px);
      line-height:1.02;
      text-transform:uppercase;
      letter-spacing:.5px;
      font-weight:900;
      color:#fff;
      max-width:850px;
    }

    .hero h1 span{
      color:var(--gold);
    }

    .eyeline{
      height:1px;
      background:var(--gold);
      width:min(360px,80%);
      margin:24px 0;
    }

    .hero p{
      font-size:18px;
      max-width:670px;
      color:#e8edf3;
      margin-bottom:30px;
      font-weight:500;
    }

    .btns{
      display:flex;
      gap:16px;
      flex-wrap:wrap;
    }

    .btn{
      padding:15px 23px;
      text-transform:uppercase;
      font-weight:800;
      font-size:13px;
      border:1px solid rgba(255,255,255,.22);
      display:inline-flex;
      gap:12px;
      align-items:center;
      background:rgba(255,255,255,.08);
      color:#fff;
      transition:.25s;
    }

    .btn:hover{
      transform:translateY(-3px);
      background:rgba(255,255,255,.14);
    }

    .btn.gold{
      background:var(--gold);
      color:#111;
      border-color:var(--gold);
    }

    .btn.gold:hover{
      background:#e0af58;
    }

    .team-section{
      padding:68px 0 78px;
      background:var(--panel);
    }

    .team-section.white{
      background:var(--white);
    }

    .team-section.dark{
      background:var(--panel);
      position:relative;
      overflow:hidden;
    }

    .team-section.dark:before{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(circle at top right,rgba(212,162,76,.13),transparent 30%);
      pointer-events:none;
    }

    .section-head{
      text-align:center;
      max-width:820px;
      margin:0 auto 46px;
      position:relative;
      z-index:1;
    }

    .label{
      color:var(--gold-deep);
      text-transform:uppercase;
      font-size:13px;
      font-weight:900;
      letter-spacing:.9px;
      margin-bottom:10px;
    }

    .section-head h2{
      font-size:clamp(32px,4vw,46px);
      line-height:1.08;
      font-weight:900;
      letter-spacing:-.8px;
      color:var(--text);
    }

    .gold-mini{
      width:52px;
      height:2px;
      background:var(--gold);
      margin:18px auto 0;
    }

    .governance-grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:22px;
      position:relative;
      z-index:1;
    }

    .team-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:22px;
      position:relative;
      z-index:1;
    }

    .technical-grid{
      grid-template-columns:repeat(3,1fr);
    }

    .team-card{
      background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);
      min-height:315px;
      padding:38px 30px;
      box-shadow:0 18px 45px rgba(13,27
