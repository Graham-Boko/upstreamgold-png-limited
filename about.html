<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Company Portal | Refined Corporate Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    :root{
      --navy:#071524;
      --navy-2:#0d1b2a;
      --navy-3:#132642;
      --navy-4:#1b314f;
      --gold:#d4a24c;
      --gold-2:#b88324;
      --gold-soft:#fff6e8;
      --bg:#f4f7fb;
      --panel:#ffffff;
      --text:#162033;
      --muted:#687789;
      --line:#e2e8f0;
      --soft:#f8fafc;
      --soft-2:#eef3f8;
      --green:#1f7a56;
      --red:#b85050;
      --blue:#315f9b;
      --amber:#a36f14;
      --sidebar:294px;
      --radius:22px;
      --shadow:0 18px 44px rgba(7,21,36,.10);
      --shadow-soft:0 10px 26px rgba(7,21,36,.07);
      --ring:0 0 0 4px rgba(212,162,76,.15);
    }

    html{scroll-behavior:smooth}

    body{
      min-height:100vh;
      overflow-x:hidden;
      font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;
      background:
        radial-gradient(circle at 100% 0%, rgba(212,162,76,.12), transparent 28%),
        radial-gradient(circle at 0% 18%, rgba(49,95,155,.08), transparent 24%),
        linear-gradient(180deg,#f9fbfd 0%,#edf2f8 100%);
      color:var(--text);
      line-height:1.5;
    }

    a{text-decoration:none;color:inherit}
    button,input,select{font:inherit}
    button{border:0}
    ::selection{background:rgba(212,162,76,.25)}

    .app{min-height:100vh;display:flex}

    .sidebar-overlay{
      position:fixed;
      inset:0;
      display:none;
      background:rgba(3,12,22,.52);
      z-index:89;
    }

    .sidebar-overlay.show{display:block}

    .sidebar{
      position:fixed;
      inset:0 auto 0 0;
      z-index:100;
      width:var(--sidebar);
      height:100vh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      color:#fff;
      background:linear-gradient(180deg,#04101d 0%,#071524 45%,#0c1d31 100%);
      border-right:1px solid rgba(255,255,255,.10);
      box-shadow:18px 0 50px rgba(7,21,36,.24);
      transform:translateX(-105%);
      transition:transform .24s ease;
    }

    .sidebar.open{transform:translateX(0)}

    @media(min-width:1025px){
      .sidebar{transform:none}
      .main{margin-left:var(--sidebar)}
      .sidebar-overlay{display:none!important}
    }

    .sidebar:before{
      content:"";
      position:absolute;
      width:370px;
      height:370px;
      right:-185px;
      top:-165px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(212,162,76,.23),transparent 70%);
      pointer-events:none;
    }

    .sidebar-brand{
      min-height:114px;
      padding:24px;
      display:flex;
      align-items:center;
      gap:14px;
      border-bottom:1px solid rgba(255,255,255,.10);
      position:relative;
      z-index:1;
    }

    .brand-mark{
      width:56px;
      height:56px;
      flex:0 0 56px;
      display:grid;
      place-items:center;
      border-radius:18px;
      border:1px solid rgba(212,162,76,.35);
      background:rgba(255,255,255,.06);
    }

    .brand-mark svg{width:38px;height:38px;display:block}

    .brand-text strong{
      display:block;
      color:#fff;
      font-size:17px;
      font-weight:900;
      letter-spacing:.1px;
      line-height:1.15;
    }

    .brand-text span{
      display:block;
      margin-top:5px;
      color:#e8bf71;
      font-size:12px;
      font-weight:900;
      letter-spacing:.55px;
      text-transform:uppercase;
    }

    .nav-menu{
      list-style:none;
      padding:18px 12px;
      flex:1;
      overflow:auto;
      position:relative;
      z-index:1;
    }

    .nav-menu::-webkit-scrollbar{width:5px}
    .nav-menu::-webkit-scrollbar-thumb{background:rgba(212,162,76,.35);border-radius:999px}

    .nav-item{
      min-height:58px;
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:8px;
      padding:0 16px;
      color:#dce4ee;
      border:1px solid transparent;
      border-radius:16px;
      cursor:pointer;
      user-select:none;
      font-size:14px;
      font-weight:850;
      position:relative;
      transition:background .2s ease,border-color .2s ease,color .2s ease;
    }

    .nav-item i{
      width:22px;
      text-align:center;
      color:#dce4ee;
      font-size:17px;
      transition:color .2s ease;
    }

    .nav-item:hover{
      background:rgba(255,255,255,.055);
      border-color:rgba(255,255,255,.08);
      color:#fff;
    }

    .nav-item:hover i{color:var(--gold)}

    .nav-item.active{
      color:#fff;
      background:linear-gradient(90deg,rgba(255,255,255,.13),rgba(255,255,255,.045));
      border-color:rgba(212,162,76,.31);
    }

    .nav-item.active:before{
      content:"";
      position:absolute;
      left:0;
      top:10px;
      bottom:10px;
      width:4px;
      border-radius:999px;
      background:var(--gold);
    }

    .nav-item.active i{color:var(--gold)}

    .sidebar-footer{
      padding:18px 16px 22px;
      border-top:1px solid rgba(255,255,255,.10);
      position:relative;
      z-index:1;
    }

    .workspace-btn{
      width:100%;
      min-height:54px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:0 16px;
      border-radius:15px;
      border:1px solid rgba(212,162,76,.55);
      background:rgba(255,255,255,.035);
      color:#f2c879;
      font-size:13px;
      font-weight:900;
      letter-spacing:.2px;
      transition:background .2s ease,border-color .2s ease;
    }

    .workspace-btn:hover{background:rgba(212,162,76,.10);border-color:rgba(212,162,76,.75)}

    .main{width:100%;min-height:100vh}

    .topbar{
      min-height:88px;
      position:sticky;
      top:0;
      z-index:80;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:0 clamp(18px,3vw,34px);
      background:rgba(255,255,255,.89);
      backdrop-filter:blur(16px);
      border-bottom:1px solid var(--line);
    }

    .topbar-left{display:flex;align-items:center;gap:14px;min-width:0}

    .mobile-toggle{
      width:46px;
      height:46px;
      display:grid;
      place-items:center;
      flex:0 0 46px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--gold-2);
      font-size:19px;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(7,21,36,.05);
    }

    @media(min-width:1025px){.mobile-toggle{display:none}}

    .page-title{min-width:0}

    .page-title .kicker{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--gold-2);
      font-size:12px;
      font-weight:900;
      letter-spacing:.45px;
      text-transform:uppercase;
      margin-bottom:4px;
    }

    .page-title h1{
      color:var(--navy);
      font-size:clamp(21px,2.2vw,28px);
      font-weight:900;
      line-height:1.1;
      letter-spacing:-.55px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .topbar-actions{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:12px;
      min-width:0;
    }

    .search-wrapper{
      height:54px;
      width:min(390px,28vw);
      min-width:240px;
      display:flex;
      align-items:center;
      gap:12px;
      border:1px solid #d9e0eb;
      background:#fff;
      color:#8793a5;
      border-radius:16px;
      padding:0 16px;
      box-shadow:0 8px 18px rgba(7,21,36,.04);
    }

    .search-wrapper:focus-within{border-color:rgba(212,162,76,.72);box-shadow:var(--ring)}

    .search-wrapper input{
      width:100%;
      border:0;
      outline:0;
      color:var(--text);
      background:transparent;
      font-size:14px;
      font-weight:750;
    }

    .top-link{
      height:54px;
      min-width:132px;
      padding:0 17px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      border-radius:16px;
      border:1px solid #d9e0eb;
      background:#fff;
      color:var(--navy);
      font-size:14px;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:0 8px 18px rgba(7,21,36,.035);
      transition:border-color .2s ease,background .2s ease,color .2s ease;
    }

    .top-link.dark{background:var(--navy);border-color:var(--navy);color:#fff}
    .top-link:hover{border-color:rgba(212,162,76,.62)}

    .content{
      width:min(1360px,calc(100% - 44px));
      margin:0 auto;
      padding:28px 0 56px;
    }

    .section-panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .section-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      padding:28px 30px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,#fff,#fbfcfe);
    }

    .section-head h2{
      display:flex;
      align-items:center;
      gap:12px;
      color:var(--navy);
      font-size:clamp(23px,2.8vw,34px);
      font-weight:900;
      line-height:1.05;
      letter-spacing:-.7px;
    }

    .section-head h2 i{color:var(--gold-2);font-size:.86em}

    .section-head p{
      color:var(--muted);
      font-size:13px;
      font-weight:750;
      margin-top:9px;
      max-width:760px;
      line-height:1.72;
    }

    .section-label,.badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(212,162,76,.34);
      background:rgba(212,162,76,.10);
      color:var(--gold-2);
      padding:8px 12px;
      border-radius:999px;
      font-size:10px;
      font-weight:900;
      letter-spacing:.65px;
      text-transform:uppercase;
      white-space:nowrap;
    }

    .badge.green{border-color:rgba(31,122,86,.25);background:rgba(31,122,86,.09);color:var(--green)}
    .badge.red{border-color:rgba(184,80,80,.25);background:rgba(184,80,80,.08);color:var(--red)}
    .badge.blue{border-color:rgba(49,95,155,.22);background:rgba(49,95,155,.08);color:var(--blue)}
    .badge.amber{border-color:rgba(163,111,20,.24);background:rgba(163,111,20,.08);color:var(--amber)}

    .empty-state{
      display:none;
      margin-top:20px;
      padding:22px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow-soft);
      color:var(--muted);
      text-align:center;
      font-size:14px;
      font-weight:850;
    }

    .home-grid{display:grid;gap:22px}

    .hero-card{
      min-height:365px;
      display:grid;
      grid-template-columns:1.08fr .92fr;
      gap:20px;
      align-items:stretch;
      border-radius:28px;
      overflow:hidden;
      background:
        linear-gradient(125deg,rgba(7,21,36,.99) 0%,rgba(13,35,67,.96) 54%,rgba(39,78,135,.82) 100%);
      box-shadow:0 24px 58px rgba(7,21,36,.18);
      position:relative;
    }

    .hero-card:before{
      content:"";
      position:absolute;
      width:520px;
      height:520px;
      right:-220px;
      top:-190px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(212,162,76,.22),transparent 68%);
      pointer-events:none;
    }

    .hero-card:after{
      content:"";
      position:absolute;
      left:-80px;
      bottom:-120px;
      width:420px;
      height:250px;
      border-radius:50%;
      border:1px solid rgba(212,162,76,.22);
      pointer-events:none;
    }

    .hero-copy{
      position:relative;
      z-index:1;
      padding:46px clamp(24px,4vw,58px);
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .home-label{
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:#e9bf6e;
      text-transform:uppercase;
      letter-spacing:3.5px;
      font-size:11px;
      font-weight:900;
      margin-bottom:20px;
    }

    .home-label:before{content:"";width:34px;height:2px;background:#e9bf6e;border-radius:999px}

    .hero-copy h2{
      color:#fff;
      font-family:Georgia,'Times New Roman',serif;
      font-size:clamp(36px,4.7vw,64px);
      line-height:1.07;
      font-weight:700;
      letter-spacing:-1.1px;
      margin-bottom:18px;
      max-width:660px;
    }

    .hero-copy p{
      color:#dbe5f1;
      font-size:15px;
      font-weight:650;
      line-height:1.86;
      max-width:730px;
    }

    .hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

    .hero-btn,.action-btn,.profile-action-btn,.small-action{
      min-height:44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      padding:0 15px;
      border-radius:13px;
      border:1px solid var(--navy);
      background:var(--navy);
      color:#fff;
      cursor:pointer;
      font-size:11px;
      font-weight:900;
      letter-spacing:.55px;
      text-transform:uppercase;
      white-space:nowrap;
      transition:background .2s ease,border-color .2s ease,color .2s ease;
    }

    .hero-btn.gold,.download-btn,.profile-action-btn.gold,.small-action.gold{background:var(--gold);border-color:var(--gold);color:#111}
    .hero-btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.24);color:#fff}
    .hero-btn:hover,.action-btn:hover,.profile-action-btn:hover,.small-action:hover{border-color:var(--gold);background:var(--gold);color:#111}

    .hero-side{
      position:relative;
      z-index:1;
      padding:34px;
      display:grid;
      align-content:center;
      gap:16px;
    }

    .time-card,.status-card{
      background:rgba(255,255,255,.105);
      border:1px solid rgba(255,255,255,.18);
      color:#fff;
      border-radius:20px;
      padding:22px;
      backdrop-filter:blur(10px);
    }

    .time-label{
      color:#e7bf70;
      font-size:11px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.8px;
      margin-bottom:8px;
    }

    .portal-clock{
      font-size:clamp(34px,4vw,50px);
      line-height:1;
      font-weight:900;
      letter-spacing:-1px;
      margin-bottom:10px;
    }

    .portal-clock .ampm{font-size:.48em;margin-left:5px;vertical-align:11px}
    .portal-date,.status-card p{color:#dfe8f1;font-size:13px;font-weight:750;line-height:1.72}
    .status-list{display:grid;gap:10px;margin-top:14px}
    .status-line{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#eef4fb;font-size:12px;font-weight:850}
    .status-dot{display:inline-flex;align-items:center;gap:7px;color:#f2c879}
    .status-dot:before{content:"";width:8px;height:8px;border-radius:999px;background:#54d18c;box-shadow:0 0 0 4px rgba(84,209,140,.14)}

    .kpi-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:16px;
    }

    .kpi-card{
      min-height:154px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow:var(--shadow-soft);
      padding:22px;
    }

    .kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .kpi-icon,.doc-icon,.contact-icon,.card-icon,.insight-icon{
      width:50px;
      height:50px;
      border-radius:15px;
      background:linear-gradient(135deg,var(--navy),var(--navy-3));
      color:var(--gold);
      border:1px solid rgba(212,162,76,.28);
      display:grid;
      place-items:center;
      flex:0 0 50px;
      font-size:17px;
    }

    .kpi-value{font-size:35px;line-height:1;font-weight:900;color:var(--navy);letter-spacing:-.95px;margin-top:20px}
    .kpi-title{font-size:13px;font-weight:900;color:var(--navy);margin-top:8px}
    .kpi-desc{font-size:12px;font-weight:750;color:var(--muted);line-height:1.6;margin-top:4px}

    .dashboard-split{
      display:grid;
      grid-template-columns:1.16fr .84fr;
      gap:22px;
      align-items:start;
    }

    .mini-panel{
      background:#fff;
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow-soft);
      overflow:hidden;
    }

    .mini-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:22px 24px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,#fff,#fbfcfe);
    }

    .mini-head h3{
      display:flex;
      align-items:center;
      gap:10px;
      color:var(--navy);
      font-size:17px;
      font-weight:900;
      letter-spacing:-.25px;
    }

    .mini-head h3 i{color:var(--gold-2)}
    .mini-body{padding:20px 24px 24px}

    .notice-list,.activity-list,.date-preview-list,.control-grid{display:grid;gap:12px}

    .notice-item,.activity-item,.date-preview-item,.control-item{
      display:grid;
      grid-template-columns:44px 1fr;
      gap:14px;
      align-items:flex-start;
      padding:15px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fbfcfe;
    }

    .notice-icon,.activity-icon{
      width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:#fff;color:var(--gold-2);border:1px solid rgba(212,162,76,.25);font-size:16px
    }

    .notice-item h4,.activity-item h4,.date-preview-item h4,.control-item h4{font-size:13px;font-weight:900;color:var(--navy);margin-bottom:4px}
    .notice-item p,.activity-item p,.date-preview-item p,.control-item p{font-size:12px;font-weight:750;color:var(--muted);line-height:1.6}

    .control-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-2);border:1px solid rgba(212,162,76,.26)}
    .progress-grid{display:grid;gap:14px}
    .progress-item{display:grid;gap:8px}
    .progress-top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;font-weight:900;color:var(--navy)}
    .progress-track{height:10px;background:#edf1f6;border-radius:999px;overflow:hidden;border:1px solid #e4e9f1}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--navy),var(--gold));border-radius:999px}

    .document-tools,.control-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
      padding:20px 30px 10px;
    }

    .tool-note{color:var(--muted);font-size:13px;font-weight:750;line-height:1.6;max-width:750px}
    .chip-row{display:flex;gap:8px;flex-wrap:wrap}

    .chip-btn{
      border:1px solid var(--line);
      background:#fff;
      color:var(--navy);
      padding:9px 13px;
      border-radius:999px;
      font-size:10px;
      font-weight:900;
      letter-spacing:.55px;
      text-transform:uppercase;
      cursor:pointer;
      transition:background .2s ease,color .2s ease,border-color .2s ease;
    }

    .chip-btn.active,.chip-btn:hover{background:var(--navy);border-color:var(--navy);color:#fff}

    .document-list,.date-list{padding:8px 30px 24px}
    .document-category{padding-top:18px}
    .document-category:first-child{padding-top:10px}

    .document-category-title{
      display:flex;
      align-items:center;
      gap:10px;
      padding:12px 0;
      color:var(--gold-2);
      font-size:12px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.95px;
      border-bottom:1px solid rgba(212,162,76,.24);
    }

    .document-row,.date-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto auto;
      gap:14px;
      align-items:center;
      padding:20px 0;
      border-bottom:1px solid var(--line);
    }

    .document-row:last-child,.date-row:last-child{border-bottom:0}

    .document-meta,.contact-meta{display:flex;align-items:flex-start;gap:14px;min-width:0}

    .document-meta h3,.contact-info h3,.insight-card h3,.partner-card h3,.date-details h3,.profile-panel h4{
      color:var(--navy);
      font-size:15px;
      font-weight:900;
      line-height:1.32;
      margin-bottom:5px;
    }

    .document-meta p,.contact-info p,.insight-card p,.partner-card p,.date-details p,.profile-panel p{
      color:var(--muted);
      font-size:12.5px;
      line-height:1.64;
      font-weight:750;
    }

    .directory-grid,.governance-grid,.partner-grid{
      padding:28px 30px 30px;
      display:grid;
      gap:18px;
    }

    .directory-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .governance-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .partner-grid{grid-template-columns:repeat(3,minmax(0,1fr))}

    .contact-card,.insight-card,.partner-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow:var(--shadow-soft);
      padding:22px;
      transition:border-color .2s ease,background .2s ease;
    }

    .contact-card:hover,.insight-card:hover,.partner-card:hover{border-color:rgba(212,162,76,.42);background:#fffdf9}

    .contact-card{
      min-height:164px;
      display:grid;
      grid-template-columns:54px minmax(0,1fr);
      gap:16px;
      align-items:flex-start;
    }

    .contact-icon{width:54px;height:54px;flex-basis:54px}
    .contact-line{display:flex;align-items:flex-start;gap:10px;color:var(--muted);font-size:12.5px;font-weight:780;margin-top:8px;word-break:break-word}
    .contact-line i{width:15px;color:var(--gold-2);padding-top:2px}
    .contact-line a{color:var(--gold-2)}

    .insight-card{
      min-height:175px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:17px;
      position:relative;
      overflow:hidden;
    }

    .insight-card:before{display:none!important}
    .insight-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .insight-icon{margin-bottom:15px}
    .insight-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}

    .partner-card{
      min-height:242px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:18px;
    }

    .partner-number{
      width:50px;
      height:50px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,var(--navy),var(--navy-3));
      border:1px solid rgba(212,162,76,.35);
      border-radius:15px;
      color:var(--gold);
      font-size:13px;
      font-weight:900;
      letter-spacing:.8px;
      margin-bottom:16px;
    }

    .partner-details{display:grid;gap:7px;margin-top:13px}
    .partner-detail{display:flex;align-items:flex-start;gap:9px;color:var(--muted);font-size:12px;font-weight:850;line-height:1.5}
    .partner-detail i{color:var(--gold-2);width:14px;margin-top:2px}

    .partner-profile-btn{
      width:100%;
      min-height:44px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      border:1px solid var(--line);
      border-radius:13px;
      background:#fff;
      color:var(--navy);
      font-size:11px;
      font-weight:900;
      letter-spacing:.55px;
      text-transform:uppercase;
      cursor:pointer;
      transition:background .2s ease,border-color .2s ease,color .2s ease;
    }

    .partner-profile-btn:hover{background:rgba(212,162,76,.08);border-color:rgba(212,162,76,.55);color:var(--gold-2)}

    .partner-profile-view{padding:30px}

    .partner-profile-header{
      display:grid;
      grid-template-columns:76px minmax(0,1fr) auto;
      align-items:center;
      gap:18px;
      padding:28px;
      border-radius:22px;
      color:#fff;
      background:linear-gradient(135deg,#071524,#0d1b2a 62%,#1b263b);
      position:relative;
      overflow:hidden;
      margin-bottom:20px;
    }

    .partner-profile-header:before{content:"";position:absolute;width:260px;height:260px;right:-120px;top:-125px;border-radius:50%;background:radial-gradient(circle,rgba(212,162,76,.24),transparent 70%)}
    .partner-profile-header>*{position:relative;z-index:1}
    .partner-profile-logo{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(212,162,76,.38);color:var(--gold);font-size:18px;font-weight:900;letter-spacing:.8px}
    .partner-profile-header h3{font-size:clamp(24px,3vw,34px);font-weight:900;line-height:1.1;margin-bottom:8px;letter-spacing:-.7px}
    .partner-profile-header p{color:#dfe8f1;font-size:13px;font-weight:750;line-height:1.6}
    .back-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(212,162,76,.50);background:rgba(212,162,76,.10);color:#f2c879;border-radius:13px;padding:13px 15px;font-size:11px;font-weight:900;letter-spacing:.45px;text-transform:uppercase;cursor:pointer;white-space:nowrap}
    .back-btn:hover{background:rgba(212,162,76,.17)}

    .partner-profile-grid,.profile-section-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
    .profile-section-grid.two{grid-template-columns:1.08fr .92fr}

    .partner-profile-info,.profile-panel{
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow-soft);
      padding:22px;
    }

    .info-label{display:flex;align-items:center;gap:8px;color:var(--gold-2);font-size:10px;font-weight:900;letter-spacing:.65px;text-transform:uppercase;margin-bottom:8px}
    .partner-profile-info strong{display:block;color:var(--navy);font-size:14px;font-weight:900;line-height:1.45;word-break:break-word}
    .profile-panel h4{display:flex;align-items:center;gap:10px;font-size:16px;margin-bottom:15px}
    .profile-panel h4 i{color:var(--gold-2)}
    .profile-detail-list{display:grid;gap:12px}
    .profile-detail-row{display:grid;grid-template-columns:145px minmax(0,1fr);gap:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
    .profile-detail-row:last-child{padding-bottom:0;border-bottom:0}
    .profile-detail-row span{color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.55px}
    .profile-detail-row strong{color:var(--navy);font-size:13px;font-weight:850;line-height:1.5;word-break:break-word}
    .profile-doc-list{display:grid;gap:12px}
    .profile-doc-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fbfcfe;color:var(--navy);font-size:13px;font-weight:850}
    .profile-doc-item div{display:flex;align-items:center;gap:10px;min-width:0}
    .profile-doc-item i{color:var(--gold-2)}
    .profile-doc-item a{color:var(--gold-2);font-size:11px;font-weight:900;text-transform:uppercase;white-space:nowrap}
    .profile-action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}

    .date-row{grid-template-columns:64px minmax(0,1fr) auto}

    .date-box{
      width:64px;
      height:64px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      border-radius:16px;
      background:var(--navy);
      border:1px solid rgba(212,162,76,.38);
      color:#fff;
      text-transform:uppercase;
      line-height:1;
      font-weight:900;
      flex:0 0 64px;
    }

    .date-box strong{font-size:20px;color:var(--gold);margin-bottom:6px}
    .date-box span{font-size:11px;letter-spacing:.75px}

    .modal{
      position:fixed;
      inset:0;
      z-index:150;
      display:none;
      place-items:center;
      padding:22px;
      background:rgba(3,12,22,.58);
    }

    .modal.show{display:grid}

    .modal-card{
      width:min(760px,100%);
      max-height:88vh;
      overflow:auto;
      background:#fff;
      border-radius:22px;
      box-shadow:0 30px 80px rgba(0,0,0,.28);
      border:1px solid rgba(255,255,255,.38);
    }

    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:22px 24px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,#fff,#fbfcfe);
    }

    .modal-head h3{color:var(--navy);font-size:18px;font-weight:900;letter-spacing:-.2px}
    .modal-close{width:40px;height:40px;border-radius:13px;background:#fff;border:1px solid var(--line);color:var(--navy);cursor:pointer;font-size:16px}
    .modal-body{padding:24px;display:grid;gap:14px;color:var(--muted);font-size:14px;font-weight:750;line-height:1.72}
    .modal-body strong{color:var(--navy)}

    .toast{
      position:fixed;
      left:50%;
      bottom:24px;
      z-index:180;
      min-width:min(520px,calc(100% - 32px));
      transform:translateX(-50%) translateY(18px);
      opacity:0;
      pointer-events:none;
      display:flex;
      align-items:center;
      gap:12px;
      padding:15px 17px;
      border-radius:16px;
      background:var(--navy);
      color:#fff;
      box-shadow:0 18px 45px rgba(7,21,36,.28);
      border:1px solid rgba(212,162,76,.35);
      transition:opacity .22s ease,transform .22s ease;
      font-size:13px;
      font-weight:850;
    }

    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast i{color:var(--gold)}

    @media(max-width:1180px){
      .hero-card{grid-template-columns:1fr}
      .hero-side{grid-template-columns:1fr 1fr;padding-top:0}
      .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .dashboard-split{grid-template-columns:1fr}
      .governance-grid,.partner-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }

    @media(max-width:1040px){
      .topbar{align-items:flex-start;flex-direction:column;padding:18px 22px}
      .topbar-actions{width:100%;justify-content:space-between;flex-wrap:wrap}
      .search-wrapper{width:100%;min-width:100%;order:3}
      .top-link{flex:1;min-width:calc(50% - 6px)}
      .directory-grid{grid-template-columns:1fr}
    }

    @media(max-width:860px){
      .content{width:min(100% - 28px,1360px);padding:22px 0 42px}
      .hero-copy{padding:36px 24px}
      .hero-side{grid-template-columns:1fr;padding:0 24px 24px}
      .section-head{padding:24px 20px;flex-direction:column;align-items:flex-start}
      .document-tools,.document-list,.date-list,.directory-grid,.governance-grid,.partner-grid,.partner-profile-view{padding-left:20px;padding-right:20px}
      .document-row{grid-template-columns:1fr;align-items:stretch;gap:12px}
      .document-row .badge{width:max-content}
      .document-row .chip-row{width:100%;display:grid;grid-template-columns:1fr 1fr}
      .action-btn{width:100%}
      .date-row{grid-template-columns:56px 1fr;gap:16px;align-items:start}
      .date-row .badge{grid-column:2;width:max-content}
      .date-box{width:56px;height:56px;flex-basis:56px}
      .partner-profile-header{grid-template-columns:1fr;align-items:flex-start}
      .partner-profile-grid,.profile-section-grid,.profile-section-grid.two{grid-template-columns:1fr}
      .profile-detail-row{grid-template-columns:1fr;gap:5px}
    }

    @media(max-width:640px){
      .sidebar{width:min(330px,88vw)}
      .content{width:min(100% - 22px,1360px)}
      .hero-copy h2{font-size:34px}
      .home-label{letter-spacing:2.4px}
      .kpi-grid,.governance-grid,.partner-grid{grid-template-columns:1fr}
      .top-link{min-width:100%}
      .document-row .chip-row{grid-template-columns:1fr}
      .contact-card{grid-template-columns:1fr}
      .mini-head{flex-direction:column;align-items:flex-start}
      .profile-doc-item{align-items:flex-start;flex-direction:column}
    }

    @media print{
      .sidebar,.topbar,.sidebar-overlay,.modal,.toast,.action-btn,.profile-action-btn,.small-action,.workspace-btn{display:none!important}
      .main{margin-left:0!important}
      .content{width:100%;padding:0}
      .section-panel,.hero-card,.kpi-card,.mini-panel,.contact-card,.insight-card,.partner-card{box-shadow:none;break-inside:avoid}
      body{background:#fff}
    }
  </style>
</head>

    const pages = {home:renderHome, partners:renderPartners, documents:renderDocuments, governance:renderGovernance, directory:renderDirectory, dates:renderDates};

    const sidebar = document.getElementById('sidebar');

    const pageContainer = document.getElementById('pageContainer');
    const currentPageTitle = document.getElementById('currentPageTitle');
    const globalSearch = document.getElementById('globalSearch');
    const emptyState = document.getElementById('emptyState');
    const documentModal = document.getElementById('documentModal');
    const modalBody = document.getElementById('modalBody');
    const registerModal = document.getElementById('registerModal');
    const registerBody = document.getElementById('registerBody');
    const registerTitle = document.getElementById('registerTitle');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');

    function findDocument(id){return allDocuments().find(doc => doc.id === id)}
    function findRegister(id){return governanceItems.find(item => item.id === id)}

    function setActivePage(page){
      navItems.forEach(item => item.classList.toggle('active', item.dataset.page === page));
      currentPageTitle.textContent = pageTitles[page] || 'Home';
      pageContainer.innerHTML = pages[page]();
      globalSearch.value = '';
      emptyState.style.display = 'none';
      closeSidebar();
      updatePortalClock();
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function openPartnerProfile(index){
      const partner = partnerProfiles[index];
      if(!partner) return;
      navItems.forEach(item => item.classList.toggle('active', item.dataset.page === 'partners'));
      currentPageTitle.textContent = partner.name;
      pageContainer.innerHTML = renderPartnerProfile(partner,index);
      globalSearch.value = '';
      emptyState.style.display = 'none';
      closeSidebar();
      window.scrollTo({top:0,behavior:'smooth'});
    }

    navItems.forEach(item => item.addEventListener('click', () => setActivePage(item.dataset.page)));

    function openSidebar(){sidebar.classList.add('open');sidebarOverlay.classList.add('show')}
    function closeSidebar(){sidebar.classList.remove('open');sidebarOverlay.classList.remove('show')}
    mobileToggle.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
    sidebarOverlay.addEventListener('click', closeSidebar);
    window.addEventListener('resize', () => { if(window.innerWidth > 1024) closeSidebar(); });

    globalSearch.addEventListener('input', () => {
      const term = globalSearch.value.trim().toLowerCase();
      const items = pageContainer.querySelectorAll('.searchable-item');
      let visibleCount = 0;

      items.forEach(item => {
        const match = !term || item.innerText.toLowerCase().includes(term);
        item.style.display = match ? '' : 'none';
        if(match) visibleCount++;
      });

      emptyState.style.display = term && visibleCount === 0 ? 'block' : 'none';
    });

    function filterDocuments(categoryName, button){
      document.querySelectorAll('.chip-btn').forEach(chip => chip.classList.remove('active'));
      button.classList.add('active');
      document.querySelectorAll('.document-category').forEach(category => {
        const match = categoryName === 'All' || category.dataset.category === categoryName;
        category.style.display = match ? 'block' : 'none';
      });
      globalSearch.value = '';
      emptyState.style.display = 'none';
    }

    function openDocumentModal(id){
      const doc = findDocument(id);
      if(!doc) return;
      modalBody.innerHTML = `
        <div class="document-meta">
          <div class="doc-icon"><i class="fas fa-file-lines"></i></div>
          <div>
            <h3>${doc.title}</h3>
            <p>${doc.desc}</p>
          </div>
        </div>
        <p><strong>Access Level:</strong> ${doc.access}</p>
        <p><strong>Document Type:</strong> ${doc.type}</p>
        <p><strong>Owner:</strong> ${doc.owner}</p>
        <p><strong>Last Updated:</strong> ${doc.updated}</p>
        <p><strong>File Path:</strong> ${doc.file}</p>
        <p>This preview panel is working. Link the file path to your real PDF inside the <strong>documents</strong> folder to open the actual document.</p>
        <div class="profile-action-row">
          <a class="profile-action-btn gold" href="${doc.file}" target="_blank" rel="noopener noreferrer"><i class="fas fa-eye"></i> Open File</a>
          <a class="profile-action-btn" href="${doc.file}" download><i class="fas fa-download"></i> Download</a>
        </div>
      `;
      documentModal.classList.add('show');
      documentModal.setAttribute('aria-hidden','false');
    }

    function closeDocumentModal(){documentModal.classList.remove('show');documentModal.setAttribute('aria-hidden','true')}

    function openRegisterModal(id){

        <div class="document-meta">
          <div class="doc-icon"><i class="${item.icon}"></i></div>
          <div>
            <h3>${item.title}</h3>
            <p>${item.purpose}</p>

        <p><strong>Access Level:</strong> ${item.label}</p>
        <p><strong>Register Status:</strong> Active reference area</p>
        <p><strong>Suggested file path:</strong> documents/governance/${item.id}.pdf</p>
        <p>Use this area to connect the governance register to the real company record when the file is ready.</p>
      `;
      registerModal.classList.add('show');
      registerModal.setAttribute('aria-hidden','false');
    }

    function closeRegisterModal(){registerModal.classList.remove('show');registerModal.setAttribute('aria-hidden','true')}

    documentModal.addEventListener('click', event => { if(event.target === documentModal) closeDocumentModal(); });
    registerModal.addEventListener('click', event => { if(event.target === registerModal) closeRegisterModal(); });
    document.addEventListener('keydown', event => { if(event.key === 'Escape'){ closeDocumentModal(); closeRegisterModal(); closeSidebar(); } });

    function downloadDocument(id){
      const doc = findDocument(id);
      if(!doc) return;
      showToast(`${doc.title} is ready. Make sure ${doc.file} exists in your documents folder.`);
      const link = document.createElement('a');
      link.href = doc.file;
      link.download = '';
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    let toastTimer;
    function showToast(message){
      toastText.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3600);
    }

    function updatePortalClock(){
      const clock = document.getElementById('portalClock');
      const date = document.getElementById('portalDate');
      if(!clock || !date) return;
      const now = new Date();
      const parts = new Intl.DateTimeFormat('en-US',{timeZone:'Pacific/Port_Moresby',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}).formatToParts(now);
      const hour = parts.find(p => p.type === 'hour')?.value || '00';
      const minute = parts.find(p => p.type === 'minute')?.value || '00';
      const second = parts.find(p => p.type === 'second')?.value || '00';
      const dayPeriod = parts.find(p => p.type === 'dayPeriod')?.value || 'AM';
      clock.innerHTML = `${hour}:${minute}:${second} <span class="ampm">${dayPeriod}</span>`;
      date.textContent = new Intl.DateTimeFormat('en-GB',{timeZone:'Pacific/Port_Moresby',weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(now) + ' • Port Moresby, Papua New Guinea';
    }

    setActivePage('home');
    setInterval(updatePortalClock, 1000);
  </script>
</body>
</html>
